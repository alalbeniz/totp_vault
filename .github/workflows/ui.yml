name: Interface checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm vendor:sync
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm test
      - run: pnpm store:assets
      - name: Package extension
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE="totp-vault-v${VERSION}"
          mkdir -p "dist/${PACKAGE}"
          cp manifest.json content.js service_worker.js visibility.js flat-overrides.css i18n.js "dist/${PACKAGE}/"
          cp popup*.html popup*.js popup*.css "dist/${PACKAGE}/"
          cp -R icons vendor _locales "dist/${PACKAGE}/"
          (cd dist && zip -r "${PACKAGE}.zip" "${PACKAGE}")

          # Chrome Web Store package: manifest.json must be at ZIP root.
          mkdir -p "dist/cws"
          cp -R "dist/${PACKAGE}/." "dist/cws/"
          (cd dist/cws && zip -r "../${PACKAGE}-cws.zip" .)
          unzip -l "dist/${PACKAGE}-cws.zip" | grep -qE '[[:space:]]manifest\.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: test-results/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.package_name }}
          path: dist/${{ env.package_name }}.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.package_name }}-cws
          path: dist/${{ env.package_name }}-cws.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chrome-web-store-assets
          path: dist/store-assets/
          retention-days: 30

          unzip -Z1 "dist/${PACKAGE}-cws.zip" | grep -qx 'i18n.js'
          unzip -Z1 "dist/${PACKAGE}-cws.zip" | grep -qx '_locales/es/messages.json'
          unzip -Z1 "dist/${PACKAGE}-cws.zip" | grep -qx '_locales/en/messages.json'

          echo "package_name=${PACKAGE}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: test-results/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.package_name }}
          path: dist/${{ env.package_name }}.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.package_name }}-cws
          path: dist/${{ env.package_name }}-cws.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chrome-web-store-assets
          path: dist/store-assets/
          retention-days: 30
