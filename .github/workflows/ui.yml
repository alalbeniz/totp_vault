name: Interface checks
on:
  push:
    branches: [codex/pastel-interface]
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm test
      - name: Package extension
        run: |
          mkdir -p dist/totp-vault-pastel
          cp manifest.json content.js service_worker.js visibility.js flat-overrides.css dist/totp-vault-pastel/
          cp popup*.html popup*.js popup*.css dist/totp-vault-pastel/
          cp -R icons dist/totp-vault-pastel/
          cd dist
          zip -r totp-vault-pastel.zip totp-vault-pastel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: test-results/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: totp-vault-pastel
          path: dist/totp-vault-pastel.zip
          retention-days: 7
